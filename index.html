<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ویدورا</title>
    <style>
      /* Opening screen until the scripts run; React then shows the same picture (src/app/Splash.tsx). */
      html, body { height: 100%; margin: 0; background: #0b1517; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: 'Vazirmatn', 'Inter', system-ui, sans-serif; }
      .boot img { width: 64px; height: 64px; }
      .boot-title { color: #fff; font-size: 18px; line-height: 28px; font-weight: 600; }
      .boot-bar { width: 192px; height: 4px; border-radius: 9999px; background: #1c3033; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <img src="/favicon.svg" alt="" />
        <div class="boot-title" id="boot-title">ویدورا</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script>
      try {
        if (localStorage.getItem('ui-lang') === 'en') document.getElementById('boot-title').textContent = 'Vidora';
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
