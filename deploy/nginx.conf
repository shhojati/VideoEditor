# Serves dist/ with the headers the editor needs (see docs/DEPLOY.md). TLS is terminated in
# front of this container (Caddy in docker-compose.yml).

# Set once at server level: a location with its own add_header would drop the COOP/COEP ones.
map $uri $cache_control {
    default        "public, max-age=604800";
    /              "no-cache";
    /index.html    "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy  same-origin    always;
    add_header Cross-Origin-Embedder-Policy require-corp  always;
    add_header Cache-Control $cache_control;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # No index.html fallback: a missing model file must 404 so the app can report it.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.mjs$ {
        default_type text/javascript;
        types { }
        try_files $uri =404;
    }

    location ~ \.onnx$ {
        default_type application/octet-stream;
        types { }
        try_files $uri =404;
    }
}
