# Runs on the server from /srv/video-editor (this file, Caddyfile, .env, fetch-models.mjs, models/).
#
#   docker compose up -d                                  # start / update
#   docker compose --profile tools run --rm fetch-models  # download Whisper models once

services:
  app:
    image: ${IMAGE:-ghcr.io/shhojati/videoeditor}:${TAG:-latest}
    restart: unless-stopped
    volumes:
      - ./models:/usr/share/nginx/html/models:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  fetch-models:
    image: node:22-slim
    profiles: [tools]
    working_dir: /app
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    volumes:
      - ./fetch-models.mjs:/app/scripts/fetch-models.mjs:ro
      - ./models:/app/public/models
    command: ["node", "scripts/fetch-models.mjs"]

volumes:
  caddy_data:
  caddy_config:
