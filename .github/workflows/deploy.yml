# On every push to main: check, build the Docker image into ghcr.io, then roll it out on the
# server over SSH (see docs/DEPLOY.md, "Docker").
#
# Repository secrets: SSH_HOST, SSH_USER, SSH_KEY (private key), optional SSH_PORT (default 22).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # ghcr.io names must be lowercase.
  IMAGE: ghcr.io/shhojati/videoeditor
  API_IMAGE: ghcr.io/shhojati/videoeditor-api
  APP_DIR: /srv/video-editor

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The API image runs Node 24 (TypeScript type stripping, node:sqlite).
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:api

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy/docker-compose.yml,scripts/fetch-models.mjs
          target: ${{ env.APP_DIR }}
          strip_components: 1

      # Default owner settings; copied into config/ only where the owner has no file yet.
      - name: Copy default settings
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: public/config
          target: ${{ env.APP_DIR }}/config-defaults
          strip_components: 2

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: TAG,GHCR_USER,GHCR_TOKEN,APP_DIR
          script_stop: true
          script: |
            cd "$APP_DIR"
            # Library folders for the Stickers / Sound effects / Overlays panes (files are added by hand).
            mkdir -p library/stickers library/sounds library/overlays
            # Account database (back it up) and owner settings (never overwritten once edited).
            mkdir -p data config
            cp -n config-defaults/* config/ 2>/dev/null || true
            if grep -q '^TAG=' .env; then sed -i "s/^TAG=.*/TAG=$TAG/" .env; else echo "TAG=$TAG" >> .env; fi
            # The token only lives for this job, so log in, pull, and log out again.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app api
            docker logout ghcr.io
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
