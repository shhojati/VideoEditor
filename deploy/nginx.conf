# Serves dist/ with the headers the editor needs (see docs/DEPLOY.md). TLS is terminated in
# front of this container (the host's web server, see docs/DEPLOY.md).

# Set once at server level: a location with its own add_header would drop the COOP/COEP ones.
map $uri $cache_control {
    default        "public, max-age=604800";
    /              "no-cache";
    /index.html    "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
    /admin.html    "no-cache";
    # Library folder listings change whenever files are added on the server.
    ~^/library/.*/$ "no-cache";
    # Owner settings (watermark, prices), edited on the server: see public/config/README.md.
    ~^/config/     "no-cache";
    # The API sends its own (no-store); an empty value adds no header.
    ~^/api/        "";
    # MCP and OAuth for AI apps (server/src/mcp.ts, oauth.ts): also the API's own headers.
    ~^/(mcp|oauth/|\.well-known/) "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy  same-origin    always;
    add_header Cross-Origin-Embedder-Policy require-corp  always;
    add_header Cache-Control $cache_control;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # No index.html fallback: a missing model file must 404 so the app can report it.
    location / {
        try_files $uri $uri/ =404;
    }

    # Stickers / sound effects / overlays, mounted from the host (deploy/docker-compose.yml). Folders
    # are listed as JSON for the editor's library panes, so there is no manifest to maintain.
    location /library/ {
        autoindex on;
        autoindex_format json;
        charset utf-8;
    }

    # Account API (server/, the `api` service in deploy/docker-compose.yml), same-origin so the
    # session cookie and COOP/COEP just work. Resolved per request through Docker's DNS, so nginx
    # starts (and the editor keeps working) even while the API is down.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        # Caddy sets the client's address here; passed on as is (the API reads the last entry).
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 32k;
    }

    # Agent bridge (server/src/bridge.ts): a tab's long-lived event stream, unbuffered…
    location = /api/bridge/stream {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # …and tool results coming back (snapshots are pictures).
    location = /api/bridge/result {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 4m;
    }

    # Built-in AI chat (server/src/chat.ts): the conversation with pictures, and a model that can take a while.
    location = /api/chat/turn {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 180s;
        client_max_body_size 8m;
    }

    # MCP endpoint for AI apps (Claude, ChatGPT, Cursor…). A call waits for the user's tab to answer.
    location = /mcp {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 180s;
        client_max_body_size 1m;
    }

    # OAuth for those apps: discovery documents, registration, the authorize page and tokens.
    location ~ ^/(oauth/|\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration)) {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        client_max_body_size 32k;
    }

    location = /admin {
        return 302 /admin.html;
    }

    location ~ \.mjs$ {
        default_type text/javascript;
        types { }
        try_files $uri =404;
    }

    location ~ \.onnx$ {
        default_type application/octet-stream;
        types { }
        try_files $uri =404;
    }
}
